[project]
name = "mototrack"
version = "0.1.0"
description = "Ego-POV motorcycle overtaking feasibility detector"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.5",
    "torchvision>=0.20",
    "ultralytics>=8.4.63",
    "lapx>=0.5.12",
    "opencv-python>=4.10",
    "numpy>=1.26,<2.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
# Native window instead of a browser tab. Optional: the web UI works without it.
desktop = ["pywebview>=5.0"]

[project.scripts]
mototrack = "mototrack.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
